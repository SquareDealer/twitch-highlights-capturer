[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hl_detector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime", "websockets"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["hl_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
