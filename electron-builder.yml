appId: local.twitch-highlight-recorder
productName: Twitch Highlight Recorder
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
